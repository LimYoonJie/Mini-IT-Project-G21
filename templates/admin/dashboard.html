{% extends "admin/base_admin.html" %}

{% block title %}
Admin Dashboard | MMU Marketplace
{% endblock %}

{% block content %}

<h1>Admin Dashboard</h1>

<div class="admin-cards">

    <div class="admin-card">
        <h2>Products</h2>
        <p>{{ products|length }}</p>

        <a href="{{ url_for('admin_products') }}">
            Manage Products
        </a>
    </div>


    <div class="admin-card">
        <h2>Orders</h2>
        <p>0</p>

        <a href="{{ url_for('admin_orders') }}">
            Manage Orders
        </a>
    </div>


    <div class="admin-card">
        <h2>Users</h2>
        <p>0</p>

        <a href="{{ url_for('admin_users') }}">
            Manage Users
        </a>
    </div>

</div>

{% endblock %}
