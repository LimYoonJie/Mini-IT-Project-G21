{% extends "base.html" %}

{% block title %}Sell an Item | MMU Second-Hand Marketplace{% endblock %}

{% block content %}
<section class="sell-page">
    <div class="section-heading">
        <p class="section-label">LIST AN ITEM</p>
        <h1>Sell on MMU Marketplace</h1>
        <p>Share something useful with another MMU student.</p>
    </div>

    <form method="POST" class="sell-form">
        {% csrf_token %}

        <label for="name">Product name</label>
        <input type="text" id="name" name="name" maxlength="200" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Choose a category</option>
            {% for group, subcategories in category_groups %}
                <optgroup label="{{ group }}">
                    {% for subcategory in subcategories %}
                    <option value="{{ subcategory }}">{{ subcategory }}</option>
                    {% endfor %}
                </optgroup>
            {% endfor %}
        </select>

        <label for="price">Price (RM)</label>
        <input type="number" id="price" name="price" min="0" step="0.01" required>

        <label for="condition">Item condition</label>
        <select id="condition" name="condition" required>
            <option value="">Choose condition</option>
            {% for value, label in condition_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" placeholder="Add details a buyer should know"></textarea>

        <label for="image">Image URL</label>
        <input type="url" id="image" name="image" placeholder="https://example.com/item.jpg">

        <button type="submit" class="btn btn-primary">Publish Listing</button>
    </form>
</section>
{% endblock %}
