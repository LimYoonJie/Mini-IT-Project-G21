{% extends "base.html" %}

{% block title %}
Register | MMU Second-Hand Marketplace
{% endblock %}

{% block content %}

<h1>Create Account</h1>

<form action="#" method="POST">

    <label for="name">
        Name
    </label>

    <input
        type="text"
        id="name"
        name="name"
        required
    >

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <button type="submit" class="btn btn-primary">
        Register
    </button>

</form>

{% endblock %}
