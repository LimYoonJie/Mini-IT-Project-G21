{% extends "base.html" %}

{% block title %}
Login | MMU Second-Hand Marketplace
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="POST" class="auth-form">
    {% csrf_token %}

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <p class="form-note">
        <a href="{% url 'password_reset' %}">Forgot your password?</a>
    </p>

    <button type="submit" class="btn btn-primary">
        Login
    </button>

</form>

<p class="form-note">
    Do not have an account?
    <a href="{% url 'register' %}">Create one</a>.
</p>

<p class="form-note">
    Admin access?
    <a href="/admin/login/?next=/admin/">Login here</a>.
</p>

{% endblock %}
