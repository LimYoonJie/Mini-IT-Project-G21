{% extends "admin/change_list.html" %}

{% block object-tools %}
    <div style="background: #1e293b; color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-family: sans-serif;">
        <h3 style="margin: 0 0 10px 0; color: #38bdf8; font-size: 16px;">📊 Real-time Platform Metrics (全自动实时统计)</h3>
        <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 30px;">
            <li>👥 <strong>Total Users:</strong> {{ total_users }}</li>
            <li>📦 <strong>Total Listings:</strong> {{ total_listings }}</li>
            <li>🛒 <strong>Completed Trades:</strong> {{ completed_trades }}</li>
        </ul>
    </div>

    {{ block.super }}
{% endblock %}
