<h1>Add Product</h1>

<form method="POST">
    <label>Product Name</label>
    <input type="text" name="name" required>

    <label>Price</label>
    <input type="number" name="price" step="0.01" required>

    <label>Description</label>
    <textarea name="description"></textarea>

    <button type="submit">Add Product</button>
</form>
